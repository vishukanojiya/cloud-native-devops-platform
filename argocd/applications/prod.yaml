apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-native-prod
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/vishukanojiya/cloud-native-devops-platform.git
    targetRevision: main
    path: kubernetes/overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true