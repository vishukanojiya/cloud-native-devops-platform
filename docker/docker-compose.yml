services:

  postgres:
    image: postgres:16
    container_name: cloud-native-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: devopsdb
      POSTGRES_USER: devopsuser
      POSTGRES_PASSWORD: devopspassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devopsuser -d devopsdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: cloud-native-backend:1.0
    container_name: cloud-native-backend
    ports:
      - "8000:8000"
    environment:
      DB_HOST: cloud-native-postgres
      DB_PORT: 5432
      DB_NAME: devopsdb
      DB_USER: devopsuser
      DB_PASSWORD: devopspassword
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: cloud-native-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  
    
